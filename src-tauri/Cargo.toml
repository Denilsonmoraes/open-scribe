[package]
name = "open-scribe"
version = "0.3.0"
description = "OpenScribe Studio — Estúdio Desktop de Animação Whiteboard"
authors = ["Denilson Moraes"]
edition = "2021"

[lib]
name = "open_scribe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
